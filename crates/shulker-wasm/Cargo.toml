[package]
name = "shulker-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "WebAssembly bindings for shulker"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shulker = { path = "../..", default-features = false }
bedrock = { git = "https://github.com/bedrock-crustaceans/bedrock-rs", branch = "feat/addon", features = ["addon"] }
annotate-snippets = "0.12"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["js"] }
wasm-bindgen = "0.2"
