name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Determine wasm-bindgen version
        id: wb
        run: |
          VER="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Cache wasm-bindgen-cli
        id: cache-wb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.wb.outputs.version }}

      - name: Install wasm-bindgen-cli
        if: steps.cache-wb.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version "${{ steps.wb.outputs.version }}"

      - name: Build WASM PWA
        run: ./scripts/build-web.sh --release

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
